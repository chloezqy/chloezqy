name: Feed the contribution piggy
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/piggy.yml'
permissions:
  contents: write
concurrency:
  group: contribution-piggy
  cancel-in-progress: false
jobs:
  piggy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test renderer
        run: python -m unittest discover -s tests -v
      - name: Fetch real contributions and render
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/piggy.py --username chloezqy
      - name: Publish images to output branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          git init -b output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add piggy-light.svg piggy-dark.svg contributions.json
          git commit -m 'Feed the piggy with fresh contributions'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push --force origin HEAD:output

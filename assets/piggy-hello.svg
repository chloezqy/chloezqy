<svg xmlns="http://www.w3.org/2000/svg" width="36" height="32" viewBox="-1 0 18 16" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">A little daydreaming pig</title>
  <desc id="desc">Chloe’s pink pixel pig blinks quietly every few seconds. Powered by curiosity and snacks.</desc>
  <style>
    .still-eyes { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .blinking-eyes { display: none; }
      .still-eyes { display: inline; }
    }
  </style>
  <!-- Reuses piggy-down.svg artwork without changing the contribution piggy. -->
<rect x="3" y="5" width="10" height="8" fill="#ac607a" />
  <rect x="2" y="7" width="12" height="4" fill="#ac607a" />
  <rect x="5" y="4" width="6" height="10" fill="#ac607a" />
  <rect x="4" y="5" width="8" height="8" fill="#f3adc2" />
  <rect x="3" y="7" width="10" height="4" fill="#f3adc2" />
  <rect x="5" y="5" width="5" height="8" fill="#f3adc2" />
  <rect x="5" y="6" width="6" height="2" fill="#ffd0da" />
  <rect x="4" y="12" width="2" height="2" fill="#ac607a" />
  <rect x="10" y="12" width="2" height="2" fill="#ac607a" />
  <rect x="3" y="2" width="3" height="4" fill="#ac607a" />
  <rect x="10" y="2" width="3" height="4" fill="#ac607a" />
  <rect x="4" y="3" width="2" height="3" fill="#f3adc2" />
  <rect x="10" y="3" width="2" height="3" fill="#f3adc2" />
  <rect x="6" y="9" width="5" height="3" fill="#db859f" />
  <rect x="7" y="10" width="1" height="1" fill="#ac607a" />
  <rect x="9" y="10" width="1" height="1" fill="#ac607a" />
  <rect x="4" y="10" width="1" height="1" fill="#db859f" />
  <rect x="12" y="10" width="1" height="1" fill="#db859f" />
<g class="blinking-eyes"><rect x="5" y="7" width="1" height="2" fill="#593d55"><animate attributeName="height" values="2;2;0.5;2;2;0.5;2;2" keyTimes="0;0.76;0.775;0.79;0.815;0.83;0.845;1" dur="7s" repeatCount="indefinite"/>
<animate attributeName="y" values="7;7;8;7;7;8;7;7" keyTimes="0;0.76;0.775;0.79;0.815;0.83;0.845;1" dur="7s" repeatCount="indefinite"/></rect><rect x="10" y="7" width="1" height="2" fill="#593d55"><animate attributeName="height" values="2;2;0.5;2;2;0.5;2;2" keyTimes="0;0.76;0.775;0.79;0.815;0.83;0.845;1" dur="7s" repeatCount="indefinite"/>
<animate attributeName="y" values="7;7;8;7;7;8;7;7" keyTimes="0;0.76;0.775;0.79;0.815;0.83;0.845;1" dur="7s" repeatCount="indefinite"/></rect></g>
<g class="still-eyes"><rect x="5" y="7" width="1" height="2" fill="#593d55" />
  <rect x="10" y="7" width="1" height="2" fill="#593d55" /></g>
</svg>
